<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cloud Cost Tracker: {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Cloud Cost Tracker</a>
            <ul class="navbar-nav ms-auto flex-row">
                {% if session.user_id %}
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/expenses">Expenses</a></li>
                    <li class="nav-item"><a class="nav-link" href="/budgets">Budgets</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logout">Log Out</a></li>
                {% else %}
                    <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Log In</a></li>
                {% endif %}
            </ul>
        </div>
    </nav>
    {% if get_flashed_messages() %}
        <div class="alert alert-primary text-center mb-0" role="alert">
            {{ get_flashed_messages() | join(" ") }}
        </div>
    {% endif %}
    <main class="container py-4">
        {% block main %}{% endblock %}
    </main>
</body>
</html>
